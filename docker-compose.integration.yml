# Isolated integration services: no application containers or persistent volumes.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: academy_integration
      POSTGRES_USER: academy_integration
      POSTGRES_PASSWORD: ${INTEGRATION_POSTGRES_PASSWORD:?Generate a temporary test password}
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy_integration -d academy_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:16379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
