<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<header class="container">
    <span class="logo">Learn&Rock</span>
    <nav>
        <a href="{% url 'home' %}">Main</a>
        <a href="{% url 'tarrifs' %}">Price</a>
        {% if user.is_authenticated %}
            {% if user.is_superuser or user.profile.is_author %}
                <a href="{% url 'add-course' %}">Add-Course</a>
            {% endif %}
            <a href="{% url 'profile' %}">Profile</a>
            <form method="post" action="{% url 'exit' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Exit</button>
            </form>

        {% else %}
            <a href={% url 'user' %}>Log in</a>
            <a href={% url 'reg' %}>Register</a>

        {% endif %}
    </nav>
</header>
    {% block main %}
    {% endblock %}
<div class="container">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center"><a href="/"
                                                           class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
                                                           aria-label="Bootstrap">
            <svg class="bi" width="30" height="24" aria-hidden="true">
                <use href="#bootstrap"></use>
            </svg>
        </a> <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span></div>
        <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li class="ms-3"><a class="text-body-secondary" href="#">
                <i class="bi bi-instagram"></i> </a></li>
            <li class="ms-3"><a class="text-body-secondary" href="#">
                <i class="bi bi-facebook"></i> </a></li>
        </ul>
    </footer>
</div>

</body>
</html>
