{% extends 'layout.html' %}
{% block main %}
<div class="form-section container">
    <h1>Відновити пароль</h1>
    {% if validlink %}
    <form method="post" class="form-register container">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-warning mb-2" type="submit">Відновить пароль</button>
    </form>
    {% else %}
    <p>This password reset link is invalid or has expired.</p>
    <a href="{% url 'pass-reset' %}">Request a new link</a>
    {% endif %}
</div>
{% endblock %}
