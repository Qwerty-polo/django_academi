name: Deploy to test

on:
  workflow_dispatch: 

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare .env file
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import secrets
          path = Path('.env')
          text = path.read_text().replace('replace-with-a-generated-secret-key', secrets.token_urlsafe(64))
          text = text.replace('POSTGRES_PASSWORD=', 'POSTGRES_PASSWORD=' + secrets.token_urlsafe(32))
          path.write_text(text)
          PY

      - name: Deploy Project
        run: docker compose up -d --build